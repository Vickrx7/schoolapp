<!doctype html>
<html lang="fr-CA">
  <body style="font-family: Arial, Helvetica, sans-serif; color: #1f2937; line-height: 1.5">
    <h2 style="margin: 0 0 16px">Votre code de connexion</h2>
    <p>Entrez ce code dans l’application pour vous connecter :</p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px; margin: 16px 0">{{ .Token }}</p>
    <p>Ou ouvrez ce lien, puis appuyez sur « Me connecter » :</p>
    <p>
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
        >Ouvrir la page de connexion</a
      >
    </p>
    <p style="color: #6b7280; font-size: 13px">
      Le code est valide pendant 60 minutes. Si vous n’avez pas demandé ce courriel, vous pouvez
      l’ignorer.
    </p>
  </body>
</html>
