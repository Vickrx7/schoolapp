# The server's journal, which holds the containers' logs (compose.yml logs to journald): kept 14
# days at most and 1 GB in all (DECISIONS D-119). A new journal file every day, so that whole files
# are old enough to delete on time (by default a file spans a month, and an entry could outlive
# the 14 days by that much). Install as /etc/systemd/journald.conf.d/lynx.conf, then:
# systemctl restart systemd-journald
[Journal]
MaxRetentionSec=14day
MaxFileSec=1day
SystemMaxUse=1G
